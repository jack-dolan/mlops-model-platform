name: CI

# The deployment jobs that used to live here (build/push to GHCR, apply-infra,
# deploy-staging, deploy-production) targeted a self-hosted Kubernetes cluster
# that was decommissioned in August 2026. They were removed with it: the runner
# they needed no longer exists, so they would have queued forever.
#
# What remains is the part that still means something — the code is linted,
# type-checked, trained and tested on every push and pull request.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src/

      - name: Format check
        run: black --check src/ tests/

      - name: Type check
        run: mypy src/

      - name: Train model
        run: python training/train_iris.py

      - name: Test
        run: pytest --cov=src --cov-report=xml
